name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend — typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_TOKEN_FACTORY_ADDRESS: "0x2DbD6C4e499577056712d2D802EF13060CF157AF"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + lint + test + build)
        run: npm run verify

  contracts:
    name: Contracts — forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Install contract dependencies
        working-directory: contracts
        run: forge install

      - name: Build and test
        working-directory: contracts
        run: forge test -vvv
